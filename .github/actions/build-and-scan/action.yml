name: Build, Push and Scan
description: Build, push and scan a Docker image

inputs:
  image_name:
    description: Docker image name
    required: true
  tag:
    description: Docker image tag
    required: true

outputs:
  image_uri:
    description: Published image URI
    value: ${{ steps.info.outputs.image_uri }}

runs:
  using: composite
  steps:
    - name: Set image URI
      id: info
      shell: bash
      run: |
        IMAGE_URI=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.image_name }}:${{ inputs.tag }}
        echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

    - name: Build image
      shell: bash
      run: docker build -t "${{ steps.info.outputs.image_uri }}" .

    - name: Push image
      shell: bash
      run: docker push "${{ steps.info.outputs.image_uri }}"

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.info.outputs.image_uri }}
        format: table
        exit-code: '0'
        severity: HIGH,CRITICAL
